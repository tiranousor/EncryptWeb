<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Пользователи и Заказы</title>
    <link href='https://unpkg.com/css.gg@2.0.0/icons/css/log-in.css' rel='stylesheet'>
    <link href='https://unpkg.com/css.gg@2.0.0/icons/css/log-out.css' rel='stylesheet'>
    <link href='https://unpkg.com/css.gg@2.0.0/icons/css/shopping-cart.css' rel='stylesheet'>
    <style>
        /* Ваши стили остаются без изменений */
        body {
            font-family: 'Poppins', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(120deg, #b3e5fc, #81d4fa);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background: linear-gradient(70deg, #42a5f5, #1e88e5);
            text-align: center;
            display: flex;
            height: 70px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
            position: fixed;
            top: 0;
            width: 100%;
            z-index:1000;
        }
        .header-title {
            color: white;
            flex: 1;
            text-align: center;
            text-transform: uppercase;
        }
        .container {
            padding: 120px 60px 60px 60px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
        }
        h1 {
            color: #0d47a1;
            margin-bottom: 30px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #e3f2fd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #90caf9;
        }
        th {
            background-color: #1e88e5;
            color: white;
        }
        td ul {
            list-style-type: none;
            padding: 0;
        }
        td ul li {
            margin-bottom: 10px;
        }
        td ul li .cart-item {
            display: flex;
            align-items: center;
            background-color: #e1f5fe;
            border: 1px solid #90caf9;
            border-radius: 10px;
            padding: 10px;
            margin: 5px 0;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        td ul li .cart-item:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        td ul li .cart-item .cart-item-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        td ul li .cart-item .cart-item-info .cart-item-title {
            font-weight: bold;
            color: #0d47a1;
        }
        td ul li .cart-item .cart-item-info .cart-item-quantity {
            color: #1976d2;
        }
        td ul li .cart-item .cart-item-info .cart-item-price {
            color: #0d47a1;
            font-weight: bold;
        }
        .back-button {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #1e88e5;
            color: white;
            text-decoration: none;
            border-radius: 32px;
            transition: background-color 0.3s ease;
            align-self: center;
        }
        .back-button:hover {
            background-color: #1565c0;
        }
        .order-status {
            padding: 5px 10px;
            border-radius: 32px;
            font-weight: bold;
            display: inline-block;
            color: white;
        }
        .status-Оформлен {
            background-color: #1e88e5;
        }
        .status-Впути {
            background-color: #42a5f5;
        }
        .status-Доставлен {
           background-color: #64b5f6;
        }                  header {
            background: linear-gradient(70deg, #0091ea, #00bcd4);
            text-align: center;
            display: flex;
            height: 70px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        .header-title {
            color: white;
            flex: 1;
            text-align: center;
            text-transform: uppercase;
            font-size: 1.8em;
            margin: 0;
        }
        .header-icons {
            display: flex;
            position: absolute;
            top: 20px;
            right: 90px;
            align-items: center;
            background-color: transparent;
            z-index: 1000;
        }
        .header-icons a {
            margin: 0 20px;
            background-color: transparent;
        }
        #nav-container {
            position: fixed;
            top: 0;
            left: -250px; /* Start offscreen */
            height: 100%;
            width: 250px;
            background: white;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2);
            transition: left 0.3s ease;
            z-index: 1100;
            padding: 20px;
            box-sizing: border-box;
        }
        #nav-container.open {
            left: 0; /* Slide in */
        }
        #nav-content ul {
            list-style: none;
            padding: 1;
            margin: 0;
        }
        #nav-content ul li {
            margin: 15px 0;
        }
        #nav-content ul li a,
        #nav-content ul li input[type="submit"] {
            color: #333;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        #nav-content ul li a:hover,
        #nav-content ul li input[type="submit"]:hover {
            color: #0091ea;
        }
        .menu-button {
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1200;
        }
        .menu-bar {
            width: 100%;
            height: 4px;
            background-color: white;
            transition: background-color 0.3s;
        }
        .bg {
            background: rgba(0, 0, 0, 0.4);
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 1050;
        }
        .bg.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
<header>
    <h1 class="header-title">Доставка Воды</h1>
    </div>
</header>
<div class="menu-button" tabindex="0">
    <div class="menu-bar"></div>
    <div class="menu-bar"></div>
    <div class="menu-bar"></div>
</div>

<div id="nav-container">
    <div id="nav-content" >
        <ul>
            <li></li>
            <li> <a href="/">Главная</a></li>
<!--            <li> <a href="/add-book">Добавить</a></li>-->
<!--            <li>  <a href="/bookDetails">Редактировать</a></li>-->
            <li> <a href="admin/users">Заказы</a></li>
            <li>
                <form th:action="@{/logout}" th:method="POST">
                    <input  style="background-color: transparent;border:0; padding: 10px 5px; display: block; text-transform: uppercase; color: #333;" onmouseover="this.style.color=' #0091ea';" onmouseout="this.style.color='#333';" type="submit" value="Выход">
                </form>
            </li>
        </ul>
    </div>
</div>
<div class="bg"></div>

<div class="container">
    <h1>Все Заказы Пользователей</h1>
    <table>
        <thead>
        <tr>
            <th>Пользователь</th>
            <th>Заказы</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${personOrdersMap.entrySet()}">
            <td th:text="${entry.key.username}">Username</td>
            <td>
                <ul>
                    <li th:each="order : ${entry.value}">
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <div class="cart-item-title">Заказ № <span th:text="${order.id}">1</span></div>
                                <div class="cart-item-price">Итого: <span th:text="${order.totalOrderPrice}">500 руб.</span></div>
                                <div class="cart-item-quantity">Дата: <span th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm:ss')}">01-01-2024 12:00:00</span></div>
                                <div class="order-status" th:class="'status-' + ${order.status}" th:text="${order.status}">Оформлен</div>
                            </div>
                        </div>
                    </li>
                </ul>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const menuButton = document.querySelector('.menu-button');
        const navContainer = document.getElementById('nav-container');
        const bg = document.querySelector('.bg');

        menuButton.addEventListener('click', () => {
            navContainer.classList.toggle('open');
            bg.classList.toggle('active');
        });

        bg.addEventListener('click', () => {
            navContainer.classList.remove('open');
            bg.classList.remove('active');
        });
    });
</script>
</body>
</html>
