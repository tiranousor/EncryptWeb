<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>
</head>
<body>
<h1>Your Messages</h1>

<!-- Check if the user is authenticated -->
<div th:if="${#authentication.principal eq 'anonymousUser'}">
    <p>You are not logged in.</p>
    <a th:href="@{/login}">Login</a>
    <a th:href="@{/registration}">Register</a>
</div>

<div th:if="${#authentication.principal ne 'anonymousUser'}">
    <!-- Display messages if the user is authenticated -->
    <h2>Received Messages</h2>
    <ul>
        <th:block th:each="message : ${receivedMessages}">
            <li>
                <strong>From:</strong> <span th:text="${message.sender.username}"></span><br>
                <strong>Encrypted Content:</strong> <span th:text="${message.content}"></span><br>
                <strong>Encryption Method:</strong> <span th:text="${message.encryptionMethod}"></span><br>
                <form th:action="@{/decryptMessage}" method="post">
                    <input type="hidden" name="messageId" th:value="${message.id}" />
                    <label for="privateKey">Enter Your Private Key:</label><br>
                    <textarea id="privateKey" name="privateKey" rows="6" cols="60" placeholder="Your RSA Private Key" required></textarea><br>
                    <button type="submit">Decrypt Message</button>
                    <div th:if="${error}">
                        <p style="color: red;" th:text="${error}"></p>
                    </div>
                </form>
                <div th:if="${decryptedMessages[message.id]}">
                    <strong>Decrypted Content:</strong> <span th:text="${decryptedMessages[message.id]}"></span>
                </div>
            </li>
        </th:block>
    </ul>

    <h2>Sent Messages</h2>
    <ul>
        <th:block th:each="message : ${sentMessages}">
            <li>
                <strong>To:</strong> <span th:text="${message.receiver.username}"></span><br>
                <strong>Encrypted Content:</strong> <span th:text="${message.content}"></span><br>
                <strong>Encryption Method:</strong> <span th:text="${message.encryptionMethod}"></span>
            </li>
        </th:block>
    </ul>

    <a th:href="@{/send-message}">Send a New Message</a>
</div>
</body>
</html>
