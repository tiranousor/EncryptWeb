<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Сообщения</title>
    <style>
        /* Стили для улучшения внешнего вида */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .user-list {
            width: 25%;
            background-color: #f5f5f5;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }
        .user-item {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
        }
        .user-item:hover {
            background-color: #e0e0e0;
        }
        .chat-container {
            width: 75%;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 15px;
            background-color: #0091ea;
            color: #fff;
        }
        .message-list {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #fafafa;
        }
        .message {
            margin-bottom: 15px;
        }
        .message .sender {
            font-weight: bold;
        }
        .message-form {
            padding: 15px;
            border-top: 1px solid #ddd;
            background-color: #f5f5f5;
        }
        .message-form textarea {
            width: 100%;
            padding: 10px;
            resize: none;
            border: 1px solid #ccc;
            border-radius: 5px;
            height: 60px;
        }
        .message-form select, .message-form button {
            margin-top: 10px;
        }
        .message.self {
            text-align: right;
        }
        .message-content {
            display: inline-block;
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
        }
        .message.self .message-content {
            background-color: #cfe9ff;
        }
        .message.other .message-content {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
<div class="user-list">
    <h2>Пользователи</h2>
    <ul>
        <li th:each="user : ${users}" class="user-item" th:data-user-id="${user.id}" th:text="${user.username}" onclick="selectUser(this)"></li>
    </ul>
</div>
<div class="chat-container">
    <div id="chat-header" class="chat-header">
        <h2>Выберите пользователя для чата</h2>
    </div>
    <div class="message-list" id="message-list">
        <!-- Сообщения будут загружаться здесь через AJAX -->
    </div>
    <div class="message-form" id="message-form" style="display: none;">
        <form id="messageForm" method="post">
            <label for="encryptionMethod">Метод шифрования:</label><br>
            <select id="encryptionMethod" name="encryptionMethod" required>
                <option value="" disabled selected>Выберите метод шифрования</option>
                <option value="RSA">RSA</option>
                <option value="AES">AES</option>
                <option value="Substitution">Шифр Цезаря</option>
            </select><br><br>
            <textarea name="content" id="messageContent" placeholder="Введите ваше сообщение..." required></textarea><br>
            <button type="submit">Отправить сообщение</button>
        </form>
    </div>
</div>

<script>
    let selectedUserId = null;

    function selectUser(element) {
        selectedUserId = element.getAttribute('data-user-id');
        const username = element.textContent;
        document.getElementById('chat-header').innerHTML = '<h2>Чат с ' + username + '</h2>';
        document.getElementById('message-form').style.display = 'block';
        loadMessages();
    }

function loadMessages() {
    fetch('/messages/' + selectedUserId)
        .then(response => response.json())
        .then(data => {
            const messageList = document.getElementById('message-list');
            messageList.innerHTML = '';
            data.forEach(message => {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                const isSelf = message.senderUsername === '${person.username}';
                if (isSelf) {
                    messageDiv.classList.add('self');
                } else {
                    messageDiv.classList.add('other');
                }
                const contentDiv = document.createElement('div');
                contentDiv.classList.add('message-content');

                // Отображаем зашифрованное сообщение
                contentDiv.innerHTML = '<span>' + message.encryptedContent + '</span>';

                messageDiv.appendChild(contentDiv);

                // Добавляем кнопку расшифровки
                const decryptButton = document.createElement('button');
                decryptButton.textContent = 'Расшифровать';
                decryptButton.onclick = function() {
                    decryptMessage(message.messageId, contentDiv, decryptButton);
                };
                messageDiv.appendChild(decryptButton);

                messageList.appendChild(messageDiv);
            });
            messageList.scrollTop = messageList.scrollHeight;
        });
}


    function decryptMessage(messageId, contentDiv, button) {
        fetch('/decrypt-message/' + messageId)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    contentDiv.innerHTML = '<span>' + data.decryptedContent + '</span>';
                    button.style.display = 'none'; // Скрываем кнопку после расшифровки
                } else {
                    alert('Ошибка при расшифровке сообщения.');
                }
            });
    }

    document.getElementById('messageForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const content = document.getElementById('messageContent').value;
        const encryptionMethod = document.getElementById('encryptionMethod').value;

        let headers = {
            'Content-Type': 'application/json'
        };

        fetch('/send-message', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({
                receiverId: selectedUserId,
                content: content,
                encryptionMethod: encryptionMethod
            })
        })
        .then(response => {
            if (response.ok) {
                document.getElementById('messageContent').value = '';
                loadMessages();
            } else {
                alert('Ошибка при отправке сообщения.');
            }
        });
    });

    // Автоматическое обновление сообщений каждые 5 секунд
    setInterval(function() {
        if (selectedUserId) {
            loadMessages();
        }
    }, 5000);
</script>

</body>
</html>
