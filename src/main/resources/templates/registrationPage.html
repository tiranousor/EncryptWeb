<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        /* Добавь стили по своему усмотрению */
        .container {
            width: 500px;
            margin: 50px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f5f6f8;
        }
        .container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #7E56C8;
        }
        .container form div {
            margin-bottom: 15px;
        }
        .container form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .container form input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .container form button {
            width: 100%;
            padding: 10px;
            background-color: #7E56C8;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .container form button:hover {
            background-color: #63419F;
        }
        .error {
            color: red;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Регистрация</h2>
    <form th:action="@{/process_registration}" th:object="${person}" method="post">
        <div>
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" th:field="*{username}" placeholder="Введите имя пользователя"/>
            <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>
        <div>
            <label for="password">Пароль</label>
            <input type="password" id="password" th:field="*{password}" placeholder="Введите пароль"/>
            <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div>
            <label for="address">Адрес доставки</label>
            <input type="text" id="address" th:field="*{address}" placeholder="Введите адрес доставки"/>
            <div class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
        </div>
        <div>
            <label for="phoneNumber">Номер телефона</label>
            <input type="text" id="phoneNumber" th:field="*{phoneNumber}" placeholder="Введите номер телефона"/>
            <div class="error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="Введите email"/>
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <button type="submit">Зарегистрироваться</button>
    </form>
</div>
</body>
</html>
