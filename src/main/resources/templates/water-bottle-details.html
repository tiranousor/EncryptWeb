<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Детали Бутылек Воды</title>
    <style>
        /* Добавь стили по своему усмотрению */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: white;
        }
        header {
            background: linear-gradient(70deg, #CAEDA7,  #7E56C8);
            text-align: center;
            display: flex;
            height: 70px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
            position: fixed;
            top: 0;
            width: 100%;
            z-index:1000;
        }
        .header-title {
            color: white;
            flex: 1;
            text-align: center;
            text-transform: uppercase;
        }
        .header-icons {
            display: flex;
            position:absolute;
            top:27px;
            right:90px;
            align-items: center;
            background-color: white;
            z-index:1000;
        }
        .header-icons a {
            margin: 0 20px;
            background-color: white;
        }
        .container {
            padding: 120px 60px 60px 150px;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
            max-width: 1200px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #F5F6F8;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #7E56C8;
            color: white;
        }
        tr:hover {
            background-color: #eaeaea;
        }
        .action-links a {
            margin-right: 10px;
            text-decoration: none;
            color: #7E56C8;
        }
        .action-links a:hover {
            text-decoration: underline;
        }
        .add-button {
            background-color: #7E56C8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 32px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
        .add-button:hover {
            background-color: #63419F;
        }
    </style>
</head>
<body>
<header>
    <h1 class="header-title">Детали Бутылек Воды</h1>
    <div class="header-icons">
        <a href="/admin/add-water-bottle"><button class="add-button">Добавить Бутылку</button></a>
        <form th:action="@{/logout}" th:method="POST">
            <button type="submit" class="add-button" style="background-color: #FF6B6B;">Выход</button>
        </form>
    </div>
</header>

<div class="container">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Объем (литры)</th>
            <th>Цена (руб.)</th>
            <th>URL Изображения</th>
            <th>Статус</th>
            <th>Количество</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="waterBottle : ${waterBottleList}">
            <td th:text="${waterBottle.id}">1</td>
            <td th:text="${waterBottle.sizeLiters}">20</td>
            <td th:text="${waterBottle.price}">500.0</td>
            <td>
                <a th:href="${waterBottle.url}" target="_blank">Посмотреть</a>
            </td>
            <td th:text="${waterBottle.status}">Available</td>
            <td th:text="${waterBottle.quantity}">100</td>
            <td class="action-links">
                <a th:href="@{/edit-water-bottle/{id}(id=${waterBottle.id})}">Редактировать</a>
                <a th:href="@{/delete-water-bottle/{id}(id=${waterBottle.id})}"
                   onclick="return confirm('Вы уверены, что хотите удалить эту бутылку?');">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
