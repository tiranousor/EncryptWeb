
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Login & Register Page</title>
    <style>
        body {
            background: linear-gradient(70deg, #0077c2, #80d8ff);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background-color: #ffffff;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            overflow: hidden;
            width: 800px;
            max-width: 100%;
            min-height: 500px;
        }

        .form-container {
            width: 50%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .form-container h1 {
            font-size: 2em;
            color: #0077c2;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-container span {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-container input {
            background-color: #e3f2fd;
            border: 1px solid #90caf9;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
            width: 100%;
            outline: none;
        }

        .form-container button {
            background-color: #0077c2;
            color: #fff;
            font-size: 14px;
            padding: 10px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            align-self: center;
        }

        .form-container button:hover {
            background-color: #005b9f;
        }

        .toggle-container {
            width: 50%;
            background-color: #0077c2;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 40px;
        }

        .toggle-container h1 {
            font-size: 1.8em;
            margin-bottom: 10px;
            text-align: center;
        }

        .toggle-container p {
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .toggle-container a {
            text-decoration: none;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .toggle-container button {
            background-color: #ffffff;
            color: #0077c2;
            border: 1px solid #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
            align-self: center;
        }

        .toggle-container button:hover {
            background-color: #80d8ff;
            color: #ffffff;
        }
    </style>
</head>

<body>

<div class="container" id="container">
    <div class="form-container sign-in">
        <form action="/process_login" method="post">
            <h1>Войти</h1>
            <span style="margin-top:20px;">Войти с помощью Логина и пароля</span>
            <input type="text" id="username" name="username" placeholder="Enter Username" required>
            <input type="password" id="password" name="password" placeholder="Enter Password" required>
            <div>
                <input type="hidden" name="referer" th:value="${param.referer}" />
            </div>

            <button style="align-self: center; " type="submit">Войти</button>
            <div th:if="${param.error}">
                <p style="color:red;">Неверное имя пользователя или пароль.</p>
            </div>
            <div th:if="${param.logout}">
                <p style="color:green;">Вы успешно вышли из аккаунта.</p>
            </div>
        </form>
    </div>

    <div class="toggle-container">
        <div class="toggle">
            <div class="toggle-panel toggle-right">
                <h1>Еще не зарегистрированы?</h1>
                <p>Пора исправлять!</p>
                <a href="/registration">
                    <button class="hidden" id="register">Зарегистрироваться</button>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('container');
    const registerBtn = document.getElementById('register');
    const loginBtn = document.getElementById('login');


    if (loginBtn) {
        loginBtn.addEventListener('click', () => {
            container.classList.remove("active");
        });
    }
</script>
</body>

</html>
