<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Доставка Воды</title>
    <link href='https://unpkg.com/css.gg@2.0.0/icons/css/log-in.css' rel='stylesheet'>
    <link href='https://unpkg.com/css.gg@2.0.0/icons/css/log-out.css' rel='stylesheet'>
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(120deg, #e0f7fa, #80d8ff);
            overflow-x: hidden;
            display: flex;
            height: 100vh;
        }
        .left-section, .right-section {
            width: 50%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
        }
        .left-section {
            background: linear-gradient(120deg, #0091ea, #00bcd4);
            color: white;
            padding: 50px;
            text-align: center;
        }
        .left-section h1 {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .left-section p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .login-button {
            background: white;
            color: #00acc1;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s ease;
            text-decoration: none;
        }
        .login-button:hover {
            background: #f0f0f0;
        }

        /* Carousel Styles */
        .carousel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 600px;
            overflow: hidden;
            perspective: 1000px;
        }
        .carousel-item {
            position: absolute;
            opacity: 0;
            transition: transform 0.5s, opacity 0.5s;
            transform-style: preserve-3d;
            background: rgba(255, 255, 255, 0.5); /* Semi-transparent background */
            border-radius: 15px; /* Rounded corners */
            padding: 20px; /* Add padding inside each item */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Shadow for a 3D effect */
        }
        .carousel-item.active {
             background: white; /* Solid white background for the central item */
    opacity: 1;
            transform: scale(1.2) translateY(0); /* Center item */
            z-index: 2;
        }
        .carousel-item.previous {
            opacity: 0.6;
            transform: scale(0.9) translateY(-200px); /* Move upwards with spacing */
            z-index: 1;
        }
        .carousel-item.next {
            opacity: 0.6;
            transform: scale(0.9) translateY(200px); /* Move downwards with spacing */
            z-index: 1;
        }
        .carousel-item img {
            max-width: 200px;
            height: auto;
            border-bottom: 2px solid #00bcd4;
            margin-bottom: 10px;
        }
    .water-item {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    margin-bottom: 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.water-price {
    font-size: 1.5em;
    color: #00796b;
    margin: 10px 0; /* Centered and evenly spaced */
    text-align: center; /* Center the text */
}

.buy-button {
    background: #0091ea;
    border: none;
    color: white;
    padding: 10px 30px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 1.1em;
    transition: background 0.3s ease;
    margin-top: 15px; /* Space between the price and button */
    text-decoration: none; /* Remove underline from the button text */
}

        .buy-button:hover {
            background: #00838f;
        }
    </style>
</head>
<body>
<div class="left-section">
    <h1>VOGU?</h1>
    <h1>VODA? НУДА.</h1>
    <p>Добро пожаловать на сайт Доставки Воды</p>
    <p>У нас вы найдете самые качественные и свежие бутылированные воды для вашего здоровья и комфорта. Заказывайте прямо сейчас и ощутите разницу!</p>
</div>
<div class="right-section">
    <div class="carousel-wrapper">
        <div th:each="waterBottle : ${waterBottle}" class="carousel-item">
            <img th:src="${waterBottle.url}" alt="Бутылка воды">
            <div class="water-price" th:text="'Цена: ' + ${waterBottle.price} + ' руб.'">Цена: 500 руб.</div>
            <div sec:authorize="hasRole('ROLE_USER')">
                <a th:href="@{/catalog}" class="buy-button">
                    Купить воду
                </a>
            </div>
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="buy-button">Войти, чтобы купить</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const items = document.querySelectorAll('.carousel-item');
        let currentIndex = 0;
        const delay = 3000; // 3 seconds

        function showItems() {
            items.forEach((item, index) => {
                item.classList.remove('active', 'previous', 'next');
                if (index === currentIndex) {
                    item.classList.add('active');
                } else if (index === (currentIndex - 1 + items.length) % items.length) {
                    item.classList.add('previous');
                } else if (index === (currentIndex + 1) % items.length) {
                    item.classList.add('next');
                }
            });
        }

        function rotateItems() {
            currentIndex = (currentIndex + 1) % items.length;
            showItems();
        }

        showItems();
        setInterval(rotateItems, delay);
    });
</script>
</body>
</html>
