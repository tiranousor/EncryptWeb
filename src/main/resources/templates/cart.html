<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
    <style>
        /* Добавь сюда стили или используй существующие */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: white;
        }
        header {
            background: linear-gradient(70deg, #CAEDA7,  #7E56C8);
            text-align: center;
            display: flex;
            height: 70px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
            position: fixed;
            top: 0;
            width: 100%;
            z-index:1000;
        }
        .header-title {
            color: white;
            flex: 1;
            text-align: center;
            text-transform: uppercase;
        }
        .header-icons {
            display: flex;
            position:absolute;
            top:27px;
            right:90px;
            align-items: center;
            background-color: white;
            z-index:1000;
        }
        .header-icons a {
            margin: 0 20px;
            background-color: white;
        }
        .container {
            padding: 120px 60px 0 150px;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
            max-width: 800px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }
        .cart-item img {
            width: 100px;
            height: 150px;
            object-fit: contain;
        }
        .cart-item-info {
            flex: 1;
            margin-left: 20px;
        }
        .cart-item-title {
            font-size: 1.2em;
            font-weight: bold;
        }
        .cart-item-price {
            font-size: 1em;
            color: #7E56C8;
        }
        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quantity-button {
            background-color: #7E56C8;
            border: none;
            color: white;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 32px;
            text-decoration: none;
        }
        .quantity-button:hover {
            background-color: #63419F;
        }
        .quantity-input {
            width: 40px;
            text-align: center;
        }
        .total-price {
            font-size: 1.5em;
            font-weight: bold;
            text-align: right;
            margin: 20px 0;
        }
        .button-style {
            background-color: #7E56C8;
            border: none;
            color: white;
            border-radius: 32px;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.15s;
            align-self: flex-end;
        }
        .button-style:hover {
            background-color: #63419F;
        }
        .back-button {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #7E56C8;
            color: white;
            text-decoration: none;
            border-radius: 32px;
            transition: background-color 0.3s ease;
        }
        .back-button:hover {
            background-color: #5e3ea6;
        }
    </style>
</head>
<body>
<header>
    <h1 class="header-title">Корзина</h1>
    <div sec:authorize="isAuthenticated()" class="header-icons">
        <a href="/cart"><i class="gg-cart"></i></a>
        <a href="/my-orders"><i class="gg-list"></i></a>
        <form th:action="@{/logout}" th:method="POST">
            <button type="submit" class="button-style">Выход</button>
        </form>
    </div>
    <div sec:authorize="!isAuthenticated()" class="header-icons">
        <a href="/login"><i class="gg-log-in"></i></a>
    </div>
</header>

<div class="container">
    <th:block th:each="order : ${orders}">
        <div class="cart-item">
            <img th:src="${order.waterBottle.url}" alt="Бутылка воды">
            <div class="cart-item-info">
                <div class="cart-item-title">Бутылка воды {{ ${order.waterBottle.sizeLiters} }} л</div>
                <div class="cart-item-price" th:text="'Цена: ' + ${order.waterBottle.price} + ' руб.'">Цена: 500 руб.</div>
            </div>
            <div class="cart-item-quantity">
                <a class="quantity-button" th:href="@{'/cartQuantityUpdate?sy=-&oId=' + ${order.id}}">-</a>
                <div class="quantity-input" th:text="${order.quantity}">1</div>
                <a class="quantity-button" th:href="@{'/cartQuantityUpdate?sy=in&oId=' + ${order.id}}">+</a>
            </div>
            <div class="total-price" th:text="${order.totalPrice}">500 руб.</div>
        </div>
    </th:block>

    <div th:if="${#lists.isEmpty(orders)}">
        <a href="/catalog" class="back-button">Вернуться к каталогу</a>
    </div>
    <div th:if="${!#lists.isEmpty(orders)}" class="total-price" th:text="'Итого: ' + ${totalOrderPrice} + ' руб.'">Итого: 500 руб.</div>
    <div th:if="${!#lists.isEmpty(orders)}">
        <form th:method="POST" th:action="@{/cart}">
            <button type="submit" class="button-style">Заказать</button>
        </form>
    </div>
</div>
</body>
</html>
