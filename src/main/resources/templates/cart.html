<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
    <style>
        /* Унифицированные стили для каталога и корзины */
        body {
            font-family: 'Poppins', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(120deg, #e0f7fa, #80d8ff);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background: linear-gradient(70deg, #0091ea, #00bcd4);
            text-align: center;
            display: flex;
            height: 70px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        .header-title {
            color: white;
            flex: 1;
            text-align: center;
            text-transform: uppercase;
            font-size: 1.8em;
            margin: 0;
        }
        .header-icons {
            display: flex;
            position: absolute;
            top: 20px;
            right: 90px;
            align-items: center;
            background-color: transparent;
            z-index: 1000;
        }
        .header-icons a {
            margin: 0 20px;
            background-color: transparent;
        }
        .container {
            padding: 120px 60px;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            width: 100%;
        }
        .cart-item {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border: 1px solid #ddd;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .cart-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        .cart-item img {
            width: 100px;
            height: auto;
            border-radius: 5px;
        }
        .cart-item-info {
            flex: 1;
            margin-left: 20px;
        }
        .cart-item-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #00796b;
        }
        .cart-item-price {
            font-size: 1em;
            color: #00796b;
            margin-top: 10px;
        }
        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quantity-button {
            background-color: #0091ea;
            border: none;
            color: white;
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 20px;
            transition: background-color 0.3s;
        }
        .quantity-button:hover {
            background-color: #0070c0;
        }
        .quantity-input {
            width: 40px;
            text-align: center;
            font-size: 1.1em;
        }
        .total-price {
            font-size: 1.5em;
            font-weight: bold;
            color: #00796b;
            text-align: right;
            margin: 20px 0;
        }
        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin-top: 20px;
        }
        .button-style {
            background-color: #0091ea;
            border: none;
            color: white;
            border-radius: 25px;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 10px;
        }
        .button-style:hover {
            background-color: #0070c0;
        }
        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0091ea;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: background-color 0.3s;
        }
        .back-button:hover {
            background-color: #0070c0;
        }
                  header {
            background: linear-gradient(70deg, #0091ea, #00bcd4);
            text-align: center;
            display: flex;
            height: 70px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        .header-title {
            color: white;
            flex: 1;
            text-align: center;
            text-transform: uppercase;
            font-size: 1.8em;
            margin: 0;
        }
        .header-icons {
            display: flex;
            position: absolute;
            top: 20px;
            right: 90px;
            align-items: center;
            background-color: transparent;
            z-index: 1000;
        }
        .header-icons a {
            margin: 0 20px;
            background-color: transparent;
        }
        #nav-container {
            position: fixed;
            top: 0;
            left: -250px; /* Start offscreen */
            height: 100%;
            width: 250px;
            background: white;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2);
            transition: left 0.3s ease;
            z-index: 1100;
            padding: 20px;
            box-sizing: border-box;
        }
        #nav-container.open {
            left: 0; /* Slide in */
        }
        #nav-content ul {
            list-style: none;
            padding: 1;
            margin: 0;
        }
        #nav-content ul li {
            margin: 15px 0;
        }
        #nav-content ul li a,
        #nav-content ul li input[type="submit"] {
            color: #333;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        #nav-content ul li a:hover,
        #nav-content ul li input[type="submit"]:hover {
            color: #0091ea;
        }
        .menu-button {
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1200;
        }
        .menu-bar {
            width: 100%;
            height: 4px;
            background-color: white;
            transition: background-color 0.3s;
        }
        .bg {
            background: rgba(0, 0, 0, 0.4);
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 1050;
        }
        .bg.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
<header>
    <h1 class="header-title">Корзина</h1>
    </div>
</header>
<div class="menu-button" tabindex="0">
    <div class="menu-bar"></div>
    <div class="menu-bar"></div>
    <div class="menu-bar"></div>
</div>

<div id="nav-container">
    <div id="nav-content" >
        <div sec:authorize="hasRole('ROLE_ADMIN')">
            <ul>
                <li></li>
                <li> <a href="/catalog">Главная</a></li>
                <li> <a href="/add-book">Добавить</a></li>
                <li>  <a href="/bookDetails">Редактировать</a></li>
                <li> <a href="/users">Заказы</a></li>
                <li>
                    <form th:action="@{/logout}" th:method="POST">
                        <input  style="background-color: transparent;border:0; padding: 10px 5px; display: block; text-transform: uppercase; color: #333;" onmouseover="this.style.color=' #0091ea';" onmouseout="this.style.color='#333';" type="submit" value="Выход">
                    </form>
                </li>
            </ul>
        </div>
        <div sec:authorize="hasRole('ROLE_USER')">
            <ul>
                <li><span sec:authentication="name"></span></li>
                <li> <a href="/catalog">Главная</a></li>

                <li>  <a href="/cart">Корзина</a></li>
                <li> <a href="/my-orders">Заказы</a></li>
                <li>
                    <form th:action="@{/logout}" th:method="POST">
                        <input  style="background-color: transparent;border:0; padding: 10px 5px; display: block; text-transform: uppercase; color: #333;" onmouseover="this.style.color=' #0091ea';" onmouseout="this.style.color='#333';" type="submit" value="Выход">
                    </form>
                </li>
            </ul>
        </div>
    </div>
</div>
<div class="bg"></div>


<div class="container">
    <th:block th:each="order : ${orders}">
        <div class="cart-item">
            <img th:src="${order.waterBottle.url}" alt="Бутылка воды">
            <div class="cart-item-info">
                <div class="cart-item-title" th:text="'Бутылка воды ' + ${order.waterBottle.sizeLiters} + ' л.'">20 л.</div>
                <div class="cart-item-price" th:text="'Цена: ' + ${order.waterBottle.price} + ' руб.'">Цена: 500 руб.</div>
            </div>
            <div class="cart-item-quantity">
                <a class="quantity-button" th:href="@{'/cartQuantityUpdate?sy=-&oId=' + ${order.id}}">-</a>
                <div class="quantity-input" th:text="${order.quantity}">1</div>
                <a class="quantity-button" th:href="@{'/cartQuantityUpdate?sy=in&oId=' + ${order.id}}">+</a>
            </div>
        </div>
    </th:block>

    <div th:if="${#lists.isEmpty(orders)}" class="button-container">
        <a href="/catalog" class="back-button">Вернуться к каталогу</a>
    </div>
    <div th:if="${!#lists.isEmpty(orders)}" class="total-price" th:text="'Итого: ' + ${totalOrderPrice} + ' руб.'">Итого: 500 руб.</div>
    <div th:if="${!#lists.isEmpty(orders)}" class="button-container">
        <form th:method="POST" th:action="@{/cart}">
            <button type="submit" class="button-style">Заказать</button>
        </form>
        <a href="/catalog" class="back-button">Вернуться к каталогу</a>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const menuButton = document.querySelector('.menu-button');
        const navContainer = document.getElementById('nav-container');
        const bg = document.querySelector('.bg');

        menuButton.addEventListener('click', () => {
            navContainer.classList.toggle('open');
            bg.classList.toggle('active');
        });

        bg.addEventListener('click', () => {
            navContainer.classList.remove('open');
            bg.classList.remove('active');
        });
    });
</script>
</body>
</html>
