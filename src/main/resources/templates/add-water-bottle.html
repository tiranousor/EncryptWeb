<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить Бутылку Воды</title>
    <style>
        /* Добавь стили по своему усмотрению */
        .container {
            width: 500px;
            margin: 50px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f5f6f8;
        }
        .container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #7E56C8;
        }
        .container form div {
            margin-bottom: 15px;
        }
        .container form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .container form input, .container form select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .container form button {
            width: 100%;
            padding: 10px;
            background-color: #7E56C8;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .container form button:hover {
            background-color: #63419F;
        }
        .error {
            color: red;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Добавить Бутылку Воды</h2>
    <form th:action="@{/add-water-bottle}" th:object="${waterBottle}" method="post">
        <div>
            <label for="sizeLiters">Объем (литры)</label>
            <input type="number" id="sizeLiters" th:field="*{sizeLiters}" min="1" placeholder="Введите объем">
            <div class="error" th:if="${#fields.hasErrors('sizeLiters')}" th:errors="*{sizeLiters}"></div>
        </div>
        <div>
            <label for="price">Цена (руб.)</label>
            <input type="number" step="0.01" id="price" th:field="*{price}" min="0" placeholder="Введите цену">
            <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>
        <button type="submit">Добавить</button>
    </form>
</div>
</body>
</html>
