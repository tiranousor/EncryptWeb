<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Мои заказы</title>
    <style>
        /* Унифицированные стили для каталога и страницы заказов */
        body {
            font-family: 'Poppins', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(120deg, #e0f7fa, #80d8ff);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background: linear-gradient(70deg, #0091ea, #00bcd4);
            text-align: center;
            display: flex;
            height: 70px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        .header-title {
            color: white;
            flex: 1;
            text-align: center;
            text-transform: uppercase;
            font-size: 1.8em;
            margin: 0;
        }
        .header-icons {
            display: flex;
            position: absolute;
            top: 20px;
            right: 90px;
            align-items: center;
            background-color: transparent;
            z-index: 1000;
        }
        .header-icons a {
            margin: 0 20px;
            background-color: transparent;
        }
        .container {
            padding: 120px 60px;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            width: 100%;
        }
        h1 {
            color: #00796b;
            margin-bottom: 30px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #0091ea;
            color: white;
        }
        td ul {
            list-style-type: none;
            padding: 0;
        }
        td ul li {
            margin-bottom: 10px;
        }
        td ul li .cart-item {
            display: flex;
            align-items: center;
            background-color: #f5f6f8;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            margin: 5px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        td ul li .cart-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        td ul li .cart-item img {
            width: 50px;
            height: 70px;
            margin-right: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            object-fit: cover;
        }
        td ul li .cart-item .cart-item-info {
            display: flex;
            flex-direction: column;
        }
        td ul li .cart-item .cart-item-info .cart-item-title {
            font-weight: bold;
            color: #00796b;
        }
        td ul li .cart-item .cart-item-info .cart-item-quantity {
            color: #777;
        }
        td ul li .cart-item .cart-item-info .cart-item-price {
            color: #343a40;
            font-weight: bold;
        }
        .back-button {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #0091ea;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: background-color 0.3s ease;
            align-self: center;
        }
        .back-button:hover {
            background-color: #0070c0;
        }
        .order-status {
            padding: 5px 10px;
            border-radius: 25px;
            font-weight: bold;
            display: inline-block;
            color: white;
        }
        .status-Оформлен {
            background-color: #7E56C8;
        }
        .status-Впути {
            background-color: #f19e4c;
        }
        .status-Доставлен {
            background-color: #6bcb43;
        }
                  header {
            background: linear-gradient(70deg, #0091ea, #00bcd4);
            text-align: center;
            display: flex;
            height: 70px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        .header-title {
            color: white;
            flex: 1;
            text-align: center;
            text-transform: uppercase;
            font-size: 1.8em;
            margin: 0;
        }
        .header-icons {
            display: flex;
            position: absolute;
            top: 20px;
            right: 90px;
            align-items: center;
            background-color: transparent;
            z-index: 1000;
        }
        .header-icons a {
            margin: 0 20px;
            background-color: transparent;
        }
        #nav-container {
            position: fixed;
            top: 0;
            left: -250px; /* Start offscreen */
            height: 100%;
            width: 250px;
            background: white;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2);
            transition: left 0.3s ease;
            z-index: 1100;
            padding: 20px;
            box-sizing: border-box;
        }
        #nav-container.open {
            left: 0; /* Slide in */
        }
        #nav-content ul {
            list-style: none;
            padding: 1;
            margin: 0;
        }
        #nav-content ul li {
            margin: 15px 0;
        }
        #nav-content ul li a,
        #nav-content ul li input[type="submit"] {
            color: #333;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        #nav-content ul li a:hover,
        #nav-content ul li input[type="submit"]:hover {
            color: #0091ea;
        }
        .menu-button {
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1200;
        }
        .menu-bar {
            width: 100%;
            height: 4px;
            background-color: white;
            transition: background-color 0.3s;
        }
        .bg {
            background: rgba(0, 0, 0, 0.4);
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 1050;
        }
        .bg.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
<header>
    <h1 class="header-title">Мои заказы</h1>
    </div>
</header>
<div class="menu-button" tabindex="0">
    <div class="menu-bar"></div>
    <div class="menu-bar"></div>
    <div class="menu-bar"></div>
</div>

<div id="nav-container">
    <div id="nav-content" >
        <div sec:authorize="hasRole('ROLE_ADMIN')">
            <ul>
                <li></li>
                <li> <a href="/catalog">Главная</a></li>
                <li> <a href="/add-book">Добавить</a></li>
                <li>  <a href="/bookDetails">Редактировать</a></li>
                <li> <a href="/users">Заказы</a></li>
                <li>
                    <form th:action="@{/logout}" th:method="POST">
                        <input  style="background-color: transparent;border:0; padding: 10px 5px; display: block; text-transform: uppercase; color: #333;" onmouseover="this.style.color=' #0091ea';" onmouseout="this.style.color='#333';" type="submit" value="Выход">
                    </form>
                </li>
            </ul>
        </div>
        <div sec:authorize="hasRole('ROLE_USER')">
            <ul>
                <li><a th:href="@{/userProfile}" sec:authentication="name"></a></li>
                <li> <a href="/catalog">Главная</a></li>

                <li>  <a href="/cart">Корзина</a></li>
                <li> <a href="/my-orders">Заказы</a></li>
                <li>
                    <form th:action="@{/logout}" th:method="POST">
                        <input  style="background-color: transparent;border:0; padding: 10px 5px; display: block; text-transform: uppercase; color: #333;" onmouseover="this.style.color=' #0091ea';" onmouseout="this.style.color='#333';" type="submit" value="Выход">
                    </form>
                </li>
            </ul>
        </div>
    </div>
</div>
<div class="bg"></div>


<div class="container">
    <h1>Ваши заказы</h1>
    <table>
        <thead>
        <tr>
            <th>Дата заказа</th>
            <th>Общая стоимость</th>
            <th>Детали заказа</th>
            <th>Статус</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td>
                <span>Дата:</span> <p th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy')}"></p>
                <span>Время:</span> <p th:text="${#temporals.format(order.orderDate, 'HH:mm:ss')}"></p>
            </td>
            <td th:text="${order.totalOrderPrice}">500 руб.</td>
            <td>
                <ul>
                    <li th:each="item : ${order.orderItems}">
                        <div class="cart-item">
                            <img th:src="${item.waterBottle.url}" alt="Бутылка воды">
                            <div class="cart-item-info">
                                <div class="cart-item-title" th:text="${item.waterBottle.sizeLiters} + ' л'">20 л</div>
                                <div class="cart-item-quantity" th:text="'Количество: ' + ${item.quantity}">Количество: 1</div>
                                <div class="cart-item-price" th:text="'Стоимость: ' + ${item.totalPrice} + ' руб.'">Стоимость: 500 руб.</div>
                            </div>
                        </div>
                    </li>
                </ul>
            </td>
            <td>
                <div th:class="'order-status status-' + ${order.status}" th:text="${order.status}">Оформлен</div>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/catalog" class="back-button">Вернуться к каталогу</a>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const menuButton = document.querySelector('.menu-button');
        const navContainer = document.getElementById('nav-container');
        const bg = document.querySelector('.bg');

        menuButton.addEventListener('click', () => {
            navContainer.classList.toggle('open');
            bg.classList.toggle('active');
        });

        bg.addEventListener('click', () => {
            navContainer.classList.remove('open');
            bg.classList.remove('active');
        });
    });
</script>
</body>
</html>
