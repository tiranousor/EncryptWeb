<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Мои заказы</title>
    <style>
        /* Добавь сюда стили или используй существующие */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: white;
        }
        header {
            background: linear-gradient(70deg, #CAEDA7,  #7E56C8);
            text-align: center;
            display: flex;
            height: 70px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
            position: fixed;
            top: 0;
            width: 100%;
            z-index:1000;
        }
        .header-title {
            color: white;
            flex: 1;
            text-align: center;
            text-transform: uppercase;
        }
        .header-icons {
            display: flex;
            position:absolute;
            top:27px;
            right:90px;
            align-items: center;
            background-color: white;
            z-index:1000;
        }
        .header-icons a {
            margin: 0 20px;
            background-color: white;
        }
        .container {
            padding: 120px 60px 0 150px;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
            max-width: 1200px;
        }
        h1 {
            color: #343a40;
            margin-bottom: 30px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #F5F6F8;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #7E56C8;
            color: white;
        }
        td ul {
            list-style-type: none;
            padding: 0;
        }
        td ul li {
            margin-bottom: 10px;
        }
        td ul li .cart-item {
            display: flex;
            align-items: center;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            margin: 5px 0;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        td ul li .cart-item img {
            width: 50px;
            height: 70px;
            margin-right: 15px;
            border: 1px solid grey;
            border-radius: 5px;
            object-fit: cover;
        }
        td ul li .cart-item .cart-item-info {
            display: flex;
            flex-direction: column;
        }
        td ul li .cart-item .cart-item-info .cart-item-title {
            font-weight: bold;
        }
        td ul li .cart-item .cart-item-info .cart-item-quantity {
            color: #777;
        }
        td ul li .cart-item .cart-item-info .cart-item-price {
            color: #343a40;
            font-weight: bold;
        }
        .back-button {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #7E56C8;
            color: white;
            text-decoration: none;
            border-radius: 32px;
            transition: background-color 0.3s ease;
            align-self: center;
        }
        .back-button:hover {
            background-color: #5e3ea6;
        }
        .order-status {
            padding: 5px 10px;
            border-radius: 32px;
            font-weight: bold;
            display: inline-block;
            color: white;
        }
        .status-Оформлен {
            background-color: #7E56C8;
        }
        .status-Впути {
            background-color: #f19e4c;
        }
        .status-Доставлен {
           background-color: #6bcb43;
        }
    </style>
</head>
<body>
<header>
    <h1 class="header-title">Мои заказы</h1>
    <div sec:authorize="isAuthenticated()" class="header-icons">
        <a href="/cart"><i class="gg-cart"></i></a>
        <a href="/my-orders"><i class="gg-list"></i></a>
        <form th:action="@{/logout}" th:method="POST">
            <button type="submit" class="button-style">Выход</button>
        </form>
    </div>
    <div sec:authorize="!isAuthenticated()" class="header-icons">
        <a href="/login"><i class="gg-log-in"></i></a>
    </div>
</header>

<div class="container">
    <h1>Ваши заказы</h1>
    <table>
        <thead>
        <tr>
            <th>Дата заказа</th>
            <th>Общая стоимость</th>
            <th>Детали заказа</th>
            <th>Статус</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td>
                <span>Дата:</span> <p th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy')}"></p>
                <span>Время:</span> <p th:text="${#temporals.format(order.orderDate, 'HH:mm:ss')}"></p>
            </td>
            <td th:text="${order.totalOrderPrice}"></td>
            <td>
                <ul>
                    <li th:each="item : ${order.orderItems}">
                        <div class="cart-item">
                            <img th:src="${item.waterBottle.url}" alt="Бутылка воды">
                            <div class="cart-item-info">
                                <div class="cart-item-title" th:text="${item.waterBottle.sizeLiters} + ' л'">20 л</div>
                                <div class="cart-item-quantity" th:text="'Количество: ' + ${item.quantity}">Количество: 1</div>
                                <div class="cart-item-price" th:text="'Стоимость: ' + ${item.totalPrice} + ' руб.'">Стоимость: 500 руб.</div>
                            </div>
                        </div>
                    </li>
                </ul>
            </td>
            <td>
                <div th:class="'order-status status-' + ${order.status}" th:text="${order.status}"></div>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/" class="back-button">Вернуться к каталогу</a>
</div>
</body>
</html>
